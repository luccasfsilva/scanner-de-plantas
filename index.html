<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frondly — Diagnóstico de Plantas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cream: #F6F2E9;
      --forest: #25392A;
      --forest-soft: #3C5443;
      --sage: #7C9473;
      --sage-light: #E3EAD9;
      --sage-lighter: #EEF3E6;
      --amber-light: #F6EAD0;
      --rust-light: #F3E0D6;
      --white: #FFFFFF;
      --ink-dim: #6B7566;
      --r-lg: 26px;
      --r-md: 18px;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--cream);
      color: var(--forest);
      font-family: 'Work Sans', sans-serif;
      margin: 0;
      padding: 20px;
    }
    .wrap { max-width: 600px; margin: 0 auto; }
    .card {
      background: var(--white);
      border-radius: var(--r-lg);
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    h1 { font-family: 'Fraunces', serif; font-size: 24px; margin: 0 0 10px; }
    .sub { color: var(--ink-dim); font-size: 14px; margin-bottom: 16px; }
    .cam-frame {
      width: 100%;
      height: 250px;
      background: var(--sage-lighter);
      border-radius: var(--r-md);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--sage-light);
    }
    .cam-frame img { width: 100%; height: 100%; object-fit: cover; }
    .controls { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    button, label {
      font-family: inherit; font-weight: 700; font-size: 14px;
      padding: 10px 18px; border-radius: 99px; border: none; cursor: pointer;
    }
    .btn-main { background: var(--forest); color: white; width: 100%; margin-top: 15px; }
    .btn-sec { background: var(--sage-light); color: var(--forest); }
    input[type="file"] { display: none; }
    .error-box {
      background: var(--rust-light); color: #8C4A31;
      padding: 12px; border-radius: 10px; margin-top: 15px; font-weight: 600; font-size: 13px;
    }
    .result-box {
      background: var(--sage-lighter); padding: 16px; border-radius: var(--r-md); margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <h1>Frondly — Pl@ntNet</h1>
      <div class="sub">Envie uma foto clara da folha ou planta para identificar.</div>

      <div class="cam-frame">
        <span id="placeholder">Nenhuma foto selecionada</span>
        <img id="preview" style="display:none;" />
      </div>

      <div class="controls">
        <label for="fileInput" class="btn-sec">📁 Selecionar Foto</label>
        <input type="file" id="fileInput" accept="image/*" />
      </div>

      <button id="sendBtn" class="btn-main" style="display:none;">✦ Identificar Planta</button>

      <div id="error" class="error-box" style="display:none;"></div>
      <div id="result" class="result-box" style="display:none;"></div>
    </div>
  </div>

  <script>
    // Cole aqui a sua chave válida criada em my.plantnet.org
    const API_KEY = "2b10gzJ6Ho9yB91ul5Wd32w";

    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const placeholder = document.getElementById('placeholder');
    const sendBtn = document.getElementById('sendBtn');
    const errorDiv = document.getElementById('error');
    const resultDiv = document.getElementById('result');

    let fileToUpload = null;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileToUpload = file;
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        placeholder.style.display = 'none';
        sendBtn.style.display = 'block';
        errorDiv.style.display = 'none';
        resultDiv.style.display = 'none';
      }
    });

    sendBtn.addEventListener('click', async () => {
      if (!fileToUpload) return;

      sendBtn.disabled = true;
      sendBtn.innerText = "Consultando Pl@ntNet...";
      errorDiv.style.display = 'none';

      try {
        const formData = new FormData();
        formData.append('images', fileToUpload);
        formData.append('organs', 'leaf');

        // Endpoint oficial v2 da Pl@ntNet
        const url = `https://my-api.plantnet.org/v2/identify/all?api-key=${API_KEY.trim()}&lang=pt`;

        const response = await fetch(url, {
          method: 'POST',
          body: formData
        });

        if (response.status === 403) {
          throw new Error("Erro 403: Chave de API negada. Verifique se ativou sua conta no e-mail ou crie uma nova chave em my.plantnet.org.");
        }

        if (!response.ok) {
          throw new Error(`Erro na API (Status ${response.status})`);
        }

        const data = await response.json();

        if (data.results && data.results.length > 0) {
          const topResult = data.results[0];
          const nomeComum = topResult.species.commonNames[0] || topResult.species.scientificNameWithoutAuthor;
          const precisao = Math.round(topResult.score * 100);

          resultDiv.innerHTML = `
            <h3>🌱 ${nomeComum}</h3>
            <p><b>Nome Científico:</b> ${topResult.species.scientificNameWithoutAuthor}</p>
            <p><b>Família:</b> ${topResult.species.family.scientificNameWithoutAuthor}</p>
            <p><b>Precisão da Identificação:</b> ${precisao}%</p>
          `;
          resultDiv.style.display = 'block';
        } else {
          throw new Error("Não foi possível identificar a planta nesta imagem.");
        }

      } catch (err) {
        errorDiv.innerText = err.message;
        errorDiv.style.display = 'block';
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "✦ Identificar Planta";
      }
    });
  </script>
</body>
</html>
